short_bio: >-
  <p>
    I am a second-year Ph.D. student in Artificial Intelligence at 
    <a href="https://www.nuaa.edu.cn/" target="_blank">Nanjing University of Aeronautics and Astronautics (NUAA)</a>, 
    advised by Prof. <a href="https://faculty.nuaa.edu.cn/qinjie/zh_CN/" target="_blank">Jie Qin</a> 
    and co-advised by Prof. <a href="https://wanglimin.github.io/" target="_blank">Limin Wang</a>.
    I also collaborate closely with Prof. <a href="https://scholar.google.com/citations?user=z84rLjoAAAAJ" target="_blank">Ling Shao</a>,
    Prof. <a href="https://scholar.google.com/citations?user=D3nE0agAAAAJ" target="_blank">Huchuan Lu</a>,
    and Prof. <a href="https://hzfu.github.io/" target="_blank">Huazhu Fu</a>.
    I am currently a research intern at <a href="https://www.tencent.com/" target="_blank">Tencent WeChat</a> (Rhino-Bird Elite Talent Program), working with Dr. <a href="https://scholar.google.com/citations?user=AjxoEpIAAAAJ" target="_blank">Qiang Chen</a>.
  </p>
  <p>
    My research interests lie in <strong>Multimodal Learning</strong> and <strong>Multimodal LLMs</strong>, 
    with a focus on video understanding, multimodal alignment, trustworthy AI, and spatial intelligence.
  </p>

