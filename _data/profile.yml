short_bio: >-
  <p>
    I am a Ph.D. candidate in Artificial Intelligence at 
    Nanjing University of Aeronautics and Astronautics (NUAA), 
    advised by Prof. <a href="https://scholar.google.com/citations?user=mhPGcuwAAAAJ" target="_blank">Jie Qin</a> 
    and co-advised by Prof. <a href="https://scholar.google.com/citations?user=HEuN8PcAAAAJ" target="_blank">Limin Wang</a> (NJU).
    I also collaborate closely with Assoc. Prof. <a href="https://scholar.google.com/citations?user=MJjM6BcAAAAJ" target="_blank">Wentong Li</a> (NUAA),
    Dr. <a href="https://scholar.google.com/citations?user=G4uCKHcAAAAJ" target="_blank">Wei Ji</a> (Yale),
    and Dr. <a href="https://scholar.google.com/citations?user=wqvr28MAAAAJ" target="_blank">Fei Shen</a> (NUS).
    I am currently a research intern at Tencent WeChat
    (<a href="https://ur.tencent.com/article/1463" target="_blank">Rhino-Bird Elite Talent Program</a>),
    working with Dr. <a href="https://scholar.google.com/citations?user=R4TEq6sAAAAJ" target="_blank">Qiang Chen</a>.
  </p>
  <p>
    I will be joining the National University of Singapore (NUS) as a CSC-funded visiting Ph.D. student for two years, under the supervision of Prof. <a href="https://scholar.google.com/citations?user=Z9DWCBEAAAAJ" target="_blank">Tat-Seng Chua</a> (Academician).
  </p>
  <p>
    My research interests include <strong>Latent Knowledge</strong>, <strong>Video Understanding</strong>, <strong>Multimodal Large Language Models</strong>, and <strong>Embodied Agents</strong>.
  </p>

